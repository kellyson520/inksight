services:
  inksight:
    build:
      context: .
      dockerfile: Dockerfile
    image: kellyson520/inksight:latest
    container_name: inksight
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "127.0.0.1:${BACKEND_PORT:-8070}:8070"
    volumes:
      # 持久化现有数据库与运行配置
      - ./backend/inksight.db:/app/backend/inksight.db
      - ./backend/cache.db:/app/backend/cache.db
      - ./backend/runtime_uploads:/app/backend/runtime_uploads
      - ./backend/data:/app/backend/data
      - ./backend/.env:/app/backend/.env
      - ./docs:/app/docs
    environment:
      - TZ=Asia/Shanghai
      - INKSIGHT_BACKEND_API_BASE=http://127.0.0.1:8070
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
