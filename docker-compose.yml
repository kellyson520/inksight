services:
  inksight:
    build:
      context: .
      dockerfile: Dockerfile
    image: kellyson520/inksight:latest
    container_name: inksight
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "127.0.0.1:${BACKEND_PORT:-8070}:8070"
    volumes:
      # 本地代码与持久化数据全量热挂载，修改即刻生效，杜绝耗时重建镜像
      - ./backend:/app/backend
      - ./webapp/public:/app/webapp/public
      - ./webapp/messages:/app/webapp/messages
      - ./webapp/.next:/app/webapp/.next
      - ./docs:/app/docs
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    environment:
      - TZ=Asia/Shanghai
      - INKSIGHT_BACKEND_API_BASE=http://127.0.0.1:8070
      - INKSIGHT_ALLOWED_WEB_HOSTS=kellson.dpdns.org,122.51.44.246,10.0.0.13,localhost,127.0.0.1,*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
